function resize(){
 const r=canvas.getBoundingClientRect();CW=r.width;CH=r.height;DPR=Math.min(2,window.devicePixelRatio||1);
 canvas.width=Math.max(1,Math.round(CW*DPR));canvas.height=Math.max(1,Math.round(CH*DPR));

function constrain(){const len=Math.hypot(player.x,player.y),limit=Math.max(10,R-15);if(len>limit){player.x=player.x*limit/len;player.y=player.y*limit/len;}}

function loadScore(raw){
 if(!raw||!Array.isArray(raw.events))throw Error('檔案缺少 events 譜面資料');
 const arr=[];
 for(const e of raw.events){const t=Number(e.time);if(!Number.isFinite(t)||t<0)continue;

  if(ns.length)arr.push({time:t,notes:ns});
 }
 arr.sort((a,b)=>a.time-b.time);
 // 對跨多列但同時間的 MIDI 發音事件自動分組，確保和弦加成正確。
 const merged=[];for(const e of arr){const last=merged[merged.length-1];if(last&&e.time-last.time<.001)last.notes.push(...e.notes);else merged.push({time:e.time,notes:e.notes.slice()});}
 if(!merged.length)throw Error('譜面沒有可用的音符');
 scoreData={title:raw.title||'新譜面',durationSeconds:Number(raw.durationSeconds)||merged.at(-1).time+5,events:merged};evs=merged;
 reset();status('已載入《'+scoreData.title+'》 · '+evs.length+'組事件');
}
function newAudio(src){
 if(audio){audio.pause();audio.removeAttribute('src');audio.load();}
 audio=new Audio(src);audio.preload='auto';audio.playsInline=true;audio.volume=1;
 audio.addEventListener('ended',()=>{playing=false;finished=true;$('playBtn').textContent='▶ 重播';msg('演奏結束！🎉\n碰撞 '+hitCount+' 次｜GM 剩餘 '+player.hp+' HP');});
 audio.addEventListener('error',()=>{playing=false;$('playBtn').textContent='▶ 開始演奏';msg('音樂無法載入。\n請確認 GitHub Pages 上仍有《Adrift in the Universe.mp3》，或按「換音樂」選音訊檔。');status('找不到音樂');});
}
newAudio(DEFAULT_MUSIC);
function reset(){
 playing=false;finished=false;audio?.pause();try{if(audio)audio.currentTime=0;}catch(e){}
 idx=0;active=[];bullets=[];flashes.clear();hitCount=0;songTime=0;invulUntil=0;player={x:0,y:0,hp:10000};joyV={x:0,y:0};knob.style.transform='translate(0px,0px)';
 $('hp').textContent='♥ GM 10,000';$('playBtn').textContent='▶ 開始演奏';
 $('time').textContent='00:00 / '+pad(scoreData.durationSeconds);
 msg('點「開始演奏」播放音樂 🎹\n左下搖桿，或在戰場內拖曳移動');
}
async function playOrPause(){
 if(playing){audio.pause();playing=false;$('playBtn').textContent='▶ 繼續';msg('已暫停');return;}
 if(finished)reset();
 try{await audio.play();playing=true;hideMsg();$('playBtn').textContent='Ⅱ 暫停';status('《'+scoreData.title+'》｜譜面同步進行中');}
 catch(e){msg('手機瀏覽器阻止播放音訊。\n請在 Safari / GitHub Pages 網站重新點「開始演奏」。');status('播放失敗：'+e.message);}
}
$('playBtn').addEventListener('click',playOrPause);
$('resetBtn').addEventListener('click',()=>{reset();status('已重置');});
$('setsBtn').addEventListener('click',()=>{sets=sets===2?3:2;$('setsBtn').textContent=sets+'組砲台';status('已切換成 '+sets+' 組 × 88鍵');});
$('scoreBtn').addEventListener('click',()=>$('scoreFile').click());
$('musicBtn').addEventListener('click',()=>$('musicFile').click());
$('scoreFile').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;
 try{loadScore(JSON.parse(await f.text()));}catch(err){msg('譜面檔讀取失敗：'+err.message);}e.target.value='';
});
$('musicFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;
 reset();if(audioURL)URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(f);newAudio(audioURL);status('新音樂：'+f.name);e.target.value='';
});
// 觸控搖桿：適用 iPhone Safari / Android，指標事件不依賴鍵盤。
function moveKnob(e){const q=joy.getBoundingClientRect(),x=e.clientX-(q.left+q.width/2),y=e.clientY-(q.top+q.height/2),radius=(q.width-48)/2;
 const len=Math.hypot(x,y)||1,scale=Math.min(1,radius/len);const xx=x*scale,yy=y*scale;
 joyV.x=xx/radius;joyV.y=yy/radius;knob.style.transform='translate('+xx+'px,'+yy+'px)';
}
joy.addEventListener('pointerdown',e=>{e.preventDefault();joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);moveKnob(e);});
joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer){e.preventDefault();moveKnob(e);}});
function releaseJoy(e){if(e.pointerId!==joyPointer)return;joyPointer=null;joyV={x:0,y:0};knob.style.transform='translate(0px,0px)';}
joy.addEventListener('pointerup',releaseJoy);joy.addEventListener('pointercancel',releaseJoy);joy.addEventListener('lostpointercapture',releaseJoy);
// 第二種操作：在畫布任意位置拖曳時使用相對位移，不會一碰就瞬間傳送角色。
canvas.addEventListener('pointerdown',e=>{e.preventDefault();dragPointer=e.pointerId;dragLast={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==dragPointer||!dragLast)return;e.preventDefault();player.x+=e.clientX-dragLast.x;player.y+=e.clientY-dragLast.y;dragLast={x:e.clientX,y:e.clientY};constrain();});
function releaseDrag(e){if(e.pointerId===dragPointer){dragPointer=null;dragLast=null;}}
canvas.addEventListener('pointerup',releaseDrag);canvas.addEventListener('pointercancel',releaseDrag);canvas.addEventListener('lostpointercapture',releaseDrag);
// 電腦也可按方向鍵／WASD，但本測試版不需要鍵盤。
const keys=new Set();window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys.add(e.code);});window.addEventListener('keyup',e=>keys.delete(e.code));
const rad=Math.PI/180;
function turretAngle(pitch,set,time){return -Math.PI/2+set*2*Math.PI/sets+(pitch-21+.5)*(2*Math.PI/sets/88)+time*2*Math.PI/CFG.rotationSeconds;}
function fire(pitch,amount,time){
 amount=Math.max(1,Math.min(15,Math.round(amount)));
 const age=Math.max(0,songTime-time);
 for(let set=0;set<sets;set++){
  const angle=turretAngle(pitch,set,time);flashes.set(set+':'+pitch,songTime+.16);
  for(let j=0;j<amount;j++){
   if(bullets.length>=CFG.maxBullets)return;
   const shot=angle+Math.PI+(j-(amount-1)/2)*CFG.shortSpreadDeg*rad;
   const vx=Math.cos(shot)*CFG.bulletSpeed,vy=Math.sin(shot)*CFG.bulletSpeed;
   const ox=Math.cos(angle)*(R-8),oy=Math.sin(angle)*(R-8);
   bullets.push({x:ox+vx*age,y:oy+vy*age,vx,vy,r:3.1,color:set===0?'#7ce9db':set===1?'#ffd890':'#d8aaff'});
  }
 }
}
function noteStart(note,chord,time){
 const long=(note.forceType==='long')||(note.forceType!=='short'&&note.duration>=CFG.longThreshold);
 const normal=long?(chord?2:1):(chord?5:4);
 const volley=Number.isFinite(Number(note.overrideVolley))&&note.overrideVolley!=null?Number(note.overrideVolley):normal;
 fire(note.pitch,volley,time);
 if(long)active.push({pitch:note.pitch,volley,end:time+note.duration,next:time+CFG.longInterval});
}
function scheduler(now){
 // 以真正音樂的播放時間為準；只有譜面發音時才啟動砲台。
 while(idx<evs.length&&evs[idx].time<=now+.008){
  const ev=evs[idx++];if(ev.time<now-1.1)continue;
  const chord=ev.notes.length>1;
  for(const n of ev.notes)noteStart(n,chord,ev.time);
 }
 const keep=[];
 for(const h of active){let count=0;
  while(h.next<=now+.008&&h.next<h.end-0.0001&&count<30){fire(h.pitch,h.volley,h.next);h.next+=CFG.longInterval;count++;}
  if(h.next<h.end)keep.push(h);
 }
 active=keep;
}
function update(dt){
 if(!playing)return;
 let kx=joyV.x,ky=joyV.y;
 if(keys.has('KeyA')||keys.has('ArrowLeft'))kx-=1;
 if(keys.has('KeyD')||keys.has('ArrowRight'))kx+=1;
 if(keys.has('KeyW')||keys.has('ArrowUp'))ky-=1;
 if(keys.has('KeyS')||keys.has('ArrowDown'))ky+=1;
 const norm=Math.max(1,Math.hypot(kx,ky));player.x+=kx/norm*CFG.playerSpeed*dt;player.y+=ky/norm*CFG.playerSpeed*dt;constrain();
 songTime=Math.max(0,(audio?.currentTime||0)+CFG.audioOffset);
 scheduler(songTime);
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(Math.hypot(b.x,b.y)>R+7){bullets.splice(i,1);continue;}
  const d=Math.hypot(b.x-player.x,b.y-player.y);
  if(d<11.5&&songTime>=invulUntil){player.hp=Math.max(0,player.hp-1);hitCount++;invulUntil=songTime+.075;bullets.splice(i,1);$('hp').textContent='♥ GM '+player.hp.toLocaleString();}
 }
 $('time').textContent=pad(audio?.currentTime||0)+' / '+pad(scoreData.durationSeconds);
}
function draw(){
 ctx.fillStyle='#081120';ctx.fillRect(0,0,CW,CH);
 // 環內細網格，便於辨認旋轉火力方向。
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();
 const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,R);grd.addColorStop(0,'#1c3854');grd.addColorStop(1,'#09182b');ctx.fillStyle=grd;ctx.fillRect(cx-R,cy-R,2*R,2*R);
 ctx.strokeStyle='rgba(111,158,188,.17)';ctx.lineWidth=.9;
 for(const f of [.25,.5,.75]){ctx.beginPath();ctx.arc(cx,cy,R*f,0,Math.PI*2);ctx.stroke();}
 ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
 // 彈幕是直線飛行；砲台位置隨譜面旋轉，會自然形成曲線隊形。
 for(const b of bullets){ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(cx+b.x,cy+b.y,b.r,0,Math.PI*2);ctx.fill();}
 // 玩家：大血量測試用，碰撞後短暫發光。
 ctx.save();ctx.translate(cx+player.x,cy+player.y);
 ctx.shadowColor= songTime<invulUntil?'#ff9292':'#abf5ff';ctx.shadowBlur=15;
 ctx.fillStyle=songTime<invulUntil?'#ffb2b2':'#e8ffff';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
 ctx.restore();
 ctx.restore();
 // 264座與176座的音符砲台都在同一個圓周，不會塞滿整張畫面。
 const colors=['#75d7c9','#ffd890','#d6a2f4'];
 for(let set=0;set<sets;set++){
  ctx.strokeStyle=colors[set];ctx.globalAlpha=.32;ctx.lineWidth=3;
  const aa=turretAngle(21,set,songTime),bb=turretAngle(108,set,songTime);
  ctx.beginPath();ctx.arc(cx,cy,R,aa,bb);ctx.stroke();ctx.globalAlpha=1;
  for(let pitch=21;pitch<=108;pitch++){
   const a=turretAngle(pitch,set,songTime),x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),glow=(flashes.get(set+':'+pitch)||0)>songTime;
   ctx.fillStyle=glow?'#ffffff':colors[set];ctx.globalAlpha=glow?1:.5;ctx.beginPath();ctx.arc(x,y,glow?3.5:1.15,0,Math.PI*2);ctx.fill();
  }
 }
 ctx.globalAlpha=1;
 ctx.strokeStyle='#77a3c5';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,R+2,0,Math.PI*2);ctx.stroke();
}
function frame(t){const dt=Math.min(.045,Math.max(0,(t-lastTime)/1000));lastTime=t;update(dt);draw();requestAnimationFrame(frame);}
window.addEventListener('pagehide',()=>{if(audio&&!audio.paused)audio.pause();playing=false;});
// GitHub Pages 若同資料夾有可編輯 JSON，優先使用該譜面；失敗就使用內建的完整1,783音符。
async function tryLoadExternal(){
 try{const res=await fetch('./宇宙漂泊.score.json?gm='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('not found');
  const raw=await res.json();loadScore(raw);status('已讀取外部可編輯譜面《'+scoreData.title+'》');
 }catch(e){status('內建《宇宙漂泊》 · 1,783音符已就緒');}
}
resize();reset();tryLoadExternal();requestAnimationFrame(frame);
</script>
</body></html>
